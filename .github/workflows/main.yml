name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0.6'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Verify gem contents and executable installation
        run: bundle exec rake package:verify

  compatibility:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / Async ${{ matrix.async }} / pg ${{ matrix.pg }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0.6']
        rails: ['~> 8.0.0', '~> 8.1.0']
        async: ['~> 2.35.0', '~> 2.37.0']
        pg: ['~> 1.5.0', '~> 1.6.0']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Resolve compatibility combination
        env:
          ACP_RAILS_CONSTRAINT: ${{ matrix.rails }}
          ACP_ASYNC_CONSTRAINT: ${{ matrix.async }}
          ACP_PG_CONSTRAINT: ${{ matrix.pg }}
        run: bundle update rails async pg
      - name: Run unit tests and lint
        run: bundle exec rake test rubocop

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acp_test
      ACP_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Run PostgreSQL integration tests
        run: bundle exec rake test:postgres

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACP_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Run Redis integration tests
        run: bundle exec rake test:redis
